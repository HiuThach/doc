<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Camera đọc chữ</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}


/* =========================
   CAMERA
========================= */

#camera {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: none;

    background: #000;
}


/* =========================
   ẢNH SAU KHI CHỤP
========================= */

#photo {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    display: none;

    background: #000;

}


/* =========================
   CANVAS ẨN
========================= */

#canvas {
    display: none;
}


/* =========================
   NÚT CHỤP
========================= */

#cameraBtn {

    position: fixed;

    bottom: 25px;

    left: 50%;

    transform: translateX(-50%);

    width: 75px;

    height: 75px;

    border-radius: 50%;

    border: 5px solid white;

    background: #e53935;

    color: white;

    font-size: 30px;

    z-index: 100;

    cursor: pointer;

}


/* =========================
   NÚT LOA TRÊN ẢNH
========================= */

.soundBtn {

    position: fixed;

    width: 48px;

    height: 48px;

    border: none;

    border-radius: 50%;

    background: rgba(255,255,255,0.95);

    box-shadow: 0 2px 8px rgba(0,0,0,0.5);

    font-size: 23px;

    z-index: 50;

    cursor: pointer;

    padding: 0;

}


/* =========================
   ĐANG XỬ LÝ
========================= */

#loading {

    position: fixed;

    top: 50%;

    left: 50%;

    transform: translate(-50%, -50%);

    background: rgba(0,0,0,0.8);

    color: white;

    padding: 18px 25px;

    border-radius: 12px;

    font-size: 18px;

    z-index: 200;

    display: none;

}


/* =========================
   KHUNG CHỨA LOA
========================= */

#buttons {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
}

.soundBtn {
    pointer-events: auto;
}


/* =========================
   HIỆU ỨNG NÚT LOA
========================= */

.soundBtn:active {

    transform: scale(0.9);

}

</style>

</head>


<body>


<!-- CAMERA -->

<video
    id="camera"
    autoplay
    playsinline
></video>


<!-- ẢNH ĐÃ CHỤP -->

<img
    id="photo"
    alt="Ảnh đã chụp"
>


<!-- CANVAS -->

<canvas id="canvas"></canvas>


<!-- NƠI CHỨA CÁC NÚT LOA -->

<div id="buttons"></div>


<!-- LOADING -->

<div id="loading">
    ⏳ Đang nhận diện chữ...
</div>


<!-- NÚT CHỤP -->

<button id="cameraBtn">
    📷
</button>


<script>


const camera =
    document.getElementById("camera");


const photo =
    document.getElementById("photo");


const canvas =
    document.getElementById("canvas");


const cameraBtn =
    document.getElementById("cameraBtn");


const buttons =
    document.getElementById("buttons");


const loading =
    document.getElementById("loading");


let stream = null;

let imageWidth = 0;

let imageHeight = 0;


/* =========================================
   MỞ CAMERA
========================================= */

async function openCamera() {

    try {

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: {
                        ideal: "environment"
                    }

                },

                audio: false

            });


        camera.srcObject =
            stream;


        camera.style.display =
            "block";


        photo.style.display =
            "none";


        buttons.innerHTML =
            "";


    }

    catch (error) {

        console.error(error);

        alert(
            "Không thể mở camera.\n\n" +
            "Hãy cho phép trình duyệt sử dụng camera."
        );

    }

}


/* =========================================
   DỪNG CAMERA
========================================= */

function stopCamera() {

    if (!stream) {
        return;
    }


    stream
        .getTracks()
        .forEach(track => {
            track.stop();
        });


    stream = null;

}


/* =========================================
   CHỤP ẢNH
========================================= */

async function takePhoto() {

    if (!stream) {
        return;
    }


    /* Kích thước ảnh */

    imageWidth =
        camera.videoWidth;

    imageHeight =
        camera.videoHeight;


    /* Canvas */

    canvas.width =
        imageWidth;

    canvas.height =
        imageHeight;


    const ctx =
        canvas.getContext("2d");


    /*
     * Chụp đúng hình camera
     */

    ctx.drawImage(

        camera,

        0,
        0,

        imageWidth,
        imageHeight

    );


    /*
     * Lưu ảnh
     */

    const image =
        canvas.toDataURL(
            "image/jpeg",
            0.95
        );


    /*
     * Dừng camera
     */

    stopCamera();


    /*
     * Hiện hình đã chụp
     */

    photo.src =
        image;

    photo.style.display =
        "block";

    camera.style.display =
        "none";


    /*
     * Xóa loa cũ
     */

    buttons.innerHTML =
        "";


    /*
     * OCR
     */

    loading.style.display =
        "block";


    await recognizeText(image);

}


/* =========================================
   OCR
========================================= */

async function recognizeText(image) {

    try {

        const worker =
            await Tesseract.createWorker(
                "vie",
                1,
                {

                    logger: info => {

                        if (
                            info.status ===
                            "recognizing text"
                        ) {

                            const percent =
                                Math.round(
                                    (info.progress || 0)
                                    * 100
                                );

                            loading.innerText =
                                "⏳ Nhận diện " +
                                percent +
                                "%";

                        }

                    }

                }
            );


        const output =
            await worker.recognize(
                image
            );


        await worker.terminate();


        loading.style.display =
            "none";


        /*
         * Lấy các dòng chữ
         */

        const lines =
            output.data.lines;


        if (
            !lines ||
            lines.length === 0
        ) {

            return;

        }


        /*
         * Tạo loa cho từng dòng
         */

        lines.forEach(line => {

            const text =
                line.text.trim();


            if (!text) {
                return;
            }


            /*
             * Tọa độ chữ trong ảnh
             */

            const bbox =
                line.bbox;


            createSoundButton(
                text,
                bbox
            );

        });


        /*
         * Đặt vị trí loa
         */

        positionButtons();

    }

    catch (error) {

        console.error(error);

        loading.style.display =
            "none";

    }

}


/* =========================================
   TẠO NÚT LOA
========================================= */

function createSoundButton(
    text,
    bbox
) {

    const button =
        document.createElement(
            "button"
        );


    button.className =
        "soundBtn";


    button.innerText =
        "🔊";


    /*
     * Lưu tọa độ chữ
     */

    button.dataset.left =
        bbox.x1;

    button.dataset.top =
        bbox.y0;

    button.dataset.right =
        bbox.x1;

    button.dataset.bottom =
        bbox.y1;


    /*
     * Khi bấm loa
     */

    button.onclick = (
        event
    ) => {

        event.stopPropagation();


        /*
         * Dừng câu đang đọc
         */

        speechSynthesis.cancel();


        /*
         * Tạo giọng đọc
         */

        const speech =
            new SpeechSynthesisUtterance(
                text
            );


        /*
         * Luôn đọc tiếng Việt
         */

        speech.lang =
            "vi-VN";


        speech.rate =
            0.9;


        speech.pitch =
            1;


        /*
         * Đọc
         */

        speechSynthesis.speak(
            speech
        );

    };


    buttons.appendChild(
        button
    );

}


/* =========================================
   ĐẶT LOA ĐÚNG VỊ TRÍ CHỮ
========================================= */

function positionButtons() {

    const screenWidth =
        window.innerWidth;

    const screenHeight =
        window.innerHeight;


    /*
     * Tính cách ảnh được hiển thị
     * với object-fit: contain
     */

    const scale =
        Math.min(

            screenWidth /
                imageWidth,

            screenHeight /
                imageHeight

        );


    /*
     * Kích thước ảnh thực tế trên màn hình
     */

    const displayedWidth =
        imageWidth * scale;

    const displayedHeight =
        imageHeight * scale;


    /*
     * Khoảng trống hai bên
     */

    const offsetX =
        (screenWidth -
            displayedWidth) / 2;


    /*
     * Khoảng trống trên dưới
     */

    const offsetY =
        (screenHeight -
            displayedHeight) / 2;


    /*
     * Lấy tất cả loa
     */

    const soundButtons =
        document.querySelectorAll(
            ".soundBtn"
        );


    soundButtons.forEach(button => {


        const left =
            parseFloat(
                button.dataset.left
            );


        const top =
            parseFloat(
                button.dataset.top
            );


        const right =
            parseFloat(
                button.dataset.right
            );


        const bottom =
            parseFloat(
                button.dataset.bottom
            );


        /*
         * Vị trí bên phải đoạn chữ
         */

        let x =
            offsetX +
            right * scale +
            8;


        /*
         * Vị trí giữa dòng chữ
         */

        let y =
            offsetY +
            ((top + bottom) / 2)
            * scale -
            24;


        /*
         * Nếu loa bị ra ngoài màn hình
         * thì đưa vào trong
         */

        if (
            x + 48 >
            screenWidth
        ) {

            x =
                offsetX +
                left * scale -
                56;

        }


        if (x < 5) {
            x = 5;
        }


        if (y < 5) {
            y = 5;
        }


        if (
            y + 48 >
            screenHeight
        ) {

            y =
                screenHeight -
                53;

        }


        button.style.left =
            x + "px";


        button.style.top =
            y + "px";

    });

}


/* =========================================
   BẤM NÚT CAMERA
========================================= */

cameraBtn.onclick = async () => {


    /*
     * Nếu chưa mở camera
     * thì mở camera
     */

    if (!stream) {

        await openCamera();

        return;

    }


    /*
     * Nếu camera đang mở
     * thì chụp
     */

    await takePhoto();

};


/* =========================================
   XOAY / THAY ĐỔI KÍCH THƯỚC MÀN HÌNH
========================================= */

window.addEventListener(
    "resize",
    () => {

        if (
            imageWidth &&
            imageHeight &&
            photo.style.display !==
            "none"
        ) {

            positionButtons();

        }

    }
);

</script>

</body>

</html>
